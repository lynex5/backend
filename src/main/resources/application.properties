# Database
spring.datasource.url=jdbc:mysql://database-2.cu5uoeu6ya3z.us-east-1.rds.amazonaws.com:3306/railway?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=admin

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Reduce startup time on Render
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Keep HikariCP connections alive (important for Render)
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=3

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# JWT - ONE definition only
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server
server.port=${PORT:8080}

# Security - hide errors
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Lockout config
auth.max.attempts=5
auth.lock.duration.minutes=15

# Support large binary uploads (PDF stored as BLOB in DB)
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Discord Webhook (use empty string as default so app does not crash if missing)
discord.webhook.url=${DISCORD_WEBHOOK_URL:}